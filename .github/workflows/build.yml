name: Build

on:
  push:
    branches: [ "dev", "ci", "main", "master" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift \
                      /usr/local/share/powershell /usr/local/share/chromium /usr/share/chromium /usr/lib/mono
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Prepare Android SDK env
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Cache NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/ndk
            ~/android-sdk/cmake
          key: android-ndk-27.3.13750724-cmake-3.22.1

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ ! -x "$SDKMANAGER" ]; then
            # 复用镜像自带的 cmdline-tools，避免依赖可能失效的 -latest 下载地址
            SRC=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f -print -quit 2>/dev/null || true)
            if [ -z "$SRC" ]; then
              echo "::error::runner image has no Android cmdline-tools"
              exit 1
            fi
            SRC_DIR=$(dirname "$(dirname "$SRC")")
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            cp -a "$SRC_DIR" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;android-37.0" "build-tools;37.0.0" \
            "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - name: Configure local.properties and signing
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          if [ -n "${API_ID}" ]; then echo "apiId=${API_ID}" >> local.properties; fi
          if [ -n "${API_HASH}" ]; then echo "apiHash=${API_HASH}" >> local.properties; fi
          echo "mapsApiKey=${MAPS_API_KEY:-}" >> local.properties
          if [ -z "${API_ID}" ] || [ -z "${API_HASH}" ]; then
            echo "::warning::未配置 API_ID / API_HASH，APK 可以构建，但无法登录 Telegram"
          fi

          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] \
              && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            echo "storeFile=${KEYSTORE_PATH}" >> local.properties
            echo "storePassword=${KEYSTORE_PASSWORD}" >> local.properties
            echo "keyAlias=${KEY_ALIAS}" >> local.properties
            echo "keyPassword=${KEY_PASSWORD}" >> local.properties
            echo "已注入 release 签名密钥"
          else
            echo "::warning::未配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD，release 包将使用 debug 签名"
          fi

      - name: Build release APK (arm64-v8a)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: TMessagesProj_App/build/outputs
          if-no-files-found: error

name: Build

on:
  push:
    branches: [ "dev", "ci", "main", "master" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift \
                      /usr/local/share/powershell /usr/local/share/chromium /usr/share/chromium /usr/lib/mono
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - name: Configure local.properties
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          if [ -n "${API_ID}" ]; then echo "apiId=${API_ID}" >> local.properties; fi
          if [ -n "${API_HASH}" ]; then echo "apiHash=${API_HASH}" >> local.properties; fi
          echo "mapsApiKey=${MAPS_API_KEY:-}" >> local.properties
          if [ -z "${API_ID}" ] || [ -z "${API_HASH}" ]; then
            echo "::warning::未配置 API_ID / API_HASH，APK 可以构建，但无法登录 Telegram"
          fi

      - name: Build release APK (arm64-v8a)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: TMessagesProj_App/build/outputs
          if-no-files-found: error
